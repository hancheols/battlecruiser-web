<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>창문·영역 찍기</title>
<style>
  :root { color-scheme: dark; --bg:#060d22; --panel:#0c1838; --line:#2c3f66; --fg:#e6f0ff; --acc:#7fd0ff; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, "Malgun Gothic", sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  header b { margin-right:auto; font-size:15px; }
  button { min-height:34px; padding:0 12px; border:1px solid var(--line); border-radius:6px; background:#122042; color:var(--fg); font:inherit; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button.on { border-color:var(--acc); background:#17306a; }
  button.primary { border-color:var(--acc); }
  main { display:grid; grid-template-columns: minmax(0,1fr) 300px; gap:12px; padding:12px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  #view { position:relative; height:calc(100vh - 150px); min-height:320px; overflow:auto; border:1px solid var(--line); background:#000; border-radius:8px; }
  #stage { position:relative; display:inline-block; cursor:crosshair; line-height:0; }
  #stage img { display:block; width:var(--w); height:auto; user-select:none; -webkit-user-drag:none; }
  .dot { position:absolute; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:#ffe27a; box-shadow:0 0 0 1px #000; pointer-events:none; }
  .dot.last { background:#ff5d8f; }
  svg.poly { position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  svg.poly polygon { fill:rgba(127,208,255,.22); stroke:#bff3ff; stroke-width:1.5; vector-effect:non-scaling-stroke; }
  svg.poly polygon.cur { fill:none; stroke:#ff5d8f; stroke-dasharray:4 3; }
  svg.poly circle { fill:#ffe27a; }
  .cursor { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border:1px solid #fff; border-radius:50%; pointer-events:none; display:none; }
  aside { display:flex; flex-direction:column; gap:10px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .box h3 { margin:0 0 6px; font-size:13px; color:var(--acc); }
  #count { font-size:20px; font-weight:700; }
  textarea { width:100%; min-height:180px; box-sizing:border-box; padding:8px; border:1px solid var(--line); border-radius:6px; background:#050b1c; color:var(--fg); font:12px/1.4 ui-monospace, Consolas, monospace; resize:vertical; }
  .row { display:flex; gap:6px; flex-wrap:wrap; }
  .hint { color:#9db3d8; font-size:12px; }
  input[type=range] { width:100%; }
</style>
</head>
<body>
<header>
  <b>창문·영역 찍기</b>
  <button id="modePoint" class="on">점 찍기</button>
  <button id="modePoly">영역 찍기</button>
  <span class="hint" id="help">점 모드: 클릭=점 추가 · 우클릭=가까운 점 삭제</span>
  <button id="undo">되돌리기</button>
  <button id="clear">전체 지우기</button>
</header>
<main>
  <section id="view"><div id="stage"><img id="pic" src="union-scene.webp?v=2" alt="배경"><svg class="poly" id="polys" viewBox="0 0 1024 1336" preserveAspectRatio="none"></svg><div class="cursor" id="cursor"></div></div></section>
  <aside>
    <div class="box">
      <h3>찍은 개수</h3>
      <div id="count">점 0 · 영역 0</div>
      <div class="hint">좌표는 배경 이미지 기준(1024×1336)입니다.</div>
    </div>
    <div class="box">
      <h3>확대</h3>
      <input type="range" id="zoom" min="60" max="300" value="100">
      <div class="hint" id="zoomLabel">100%</div>
    </div>
    <div class="box">
      <h3>영역 모드 사용법</h3>
      <div class="hint">영역 모드에서 윤곽을 따라 클릭하면 점이 이어집니다. <b>더블클릭</b>하면 영역이 닫혀 저장됩니다. 잘못 찍었으면 우클릭으로 마지막 점을 지웁니다. "영역 취소"는 찍는 중인 영역을 버립니다.</div>
      <div class="row" style="margin-top:6px"><button id="cancelPoly">영역 취소</button></div>
    </div>
    <div class="box">
      <h3>좌표 목록</h3>
      <textarea id="out" readonly></textarea>
      <div class="row" style="margin-top:6px">
        <button class="primary" id="copy">복사</button>
      </div>
    </div>
    <div class="box">
      <h3>다시 불러오기</h3>
      <textarea id="paste" placeholder="복사해 둔 목록을 붙여넣고 불러오기를 누르세요"></textarea>
      <div class="row" style="margin-top:6px"><button id="load">불러오기</button></div>
    </div>
  </aside>
</main>
<script>
(() => {
  const W = 1024, H = 1336;
  const pic = document.getElementById('pic');
  const stage = document.getElementById('stage');
  const view = document.getElementById('view');
  const cursor = document.getElementById('cursor');
  const polySvg = document.getElementById('polys');
  const out = document.getElementById('out');
  const count = document.getElementById('count');
  const zoom = document.getElementById('zoom');
  const zoomLabel = document.getElementById('zoomLabel');
  const help = document.getElementById('help');
  const modePoint = document.getElementById('modePoint');
  const modePoly = document.getElementById('modePoly');
  const KEY = 'window-picker-v2';
  let data = { points: [], polys: [] };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.points) data = s; } catch (e) {}
  let mode = 'point';
  let cur = [];

  const setZoom = () => {
    const base = Math.min(view.clientWidth - 4, 760);
    stage.style.setProperty('--w', (base * zoom.value / 100) + 'px');
    zoomLabel.textContent = zoom.value + '%';
  };

  const toImage = (e) => {
    const r = pic.getBoundingClientRect();
    const x = Math.round((e.clientX - r.left) / r.width * W);
    const y = Math.round((e.clientY - r.top) / r.height * H);
    return [Math.min(W, Math.max(0, x)), Math.min(H, Math.max(0, y))];
  };

  const render = () => {
    stage.querySelectorAll('.dot').forEach(d => d.remove());
    data.points.forEach(([x, y], i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === data.points.length - 1 ? ' last' : '');
      d.style.left = (x / W * 100) + '%';
      d.style.top = (y / H * 100) + '%';
      stage.appendChild(d);
    });
    let svg = '';
    data.polys.forEach(p => { svg += `<polygon points="${p.map(([x, y]) => x + ',' + y).join(' ')}"/>`; });
    if (cur.length) {
      svg += `<polygon class="cur" points="${cur.map(([x, y]) => x + ',' + y).join(' ')}"/>`;
      cur.forEach(([x, y]) => { svg += `<circle cx="${x}" cy="${y}" r="4"/>`; });
    }
    polySvg.innerHTML = svg;
    count.textContent = `점 ${data.points.length} · 영역 ${data.polys.length}`;
    out.value = JSON.stringify(data);
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {}
  };

  const setMode = (m) => {
    mode = m;
    modePoint.classList.toggle('on', m === 'point');
    modePoly.classList.toggle('on', m === 'poly');
    help.textContent = m === 'point'
      ? '점 모드: 클릭=점 추가 · 우클릭=가까운 점 삭제'
      : '영역 모드: 클릭=꼭짓점 추가 · 더블클릭=영역 닫기 · 우클릭=마지막 꼭짓점 삭제';
    cur = [];
    render();
  };
  modePoint.onclick = () => setMode('point');
  modePoly.onclick = () => setMode('poly');

  // 더블클릭 시 click 두 번이 먼저 들어오므로, 마지막 click의 중복 점을 제거한다
  stage.addEventListener('click', (e) => {
    if (!pic.complete) return;
    const p = toImage(e);
    if (mode === 'point') { data.points.push(p); render(); return; }
    const last = cur[cur.length - 1];
    if (last && last[0] === p[0] && last[1] === p[1]) return;
    cur.push(p); render();
  });

  stage.addEventListener('dblclick', (e) => {
    if (mode !== 'poly') return;
    // 더블클릭의 두 번째 click이 중복 꼭짓점을 넣었을 수 있으므로 정리
    while (cur.length > 1 && cur[cur.length - 1].join() === cur[cur.length - 2].join()) cur.pop();
    if (cur.length >= 3) { data.polys.push(cur); }
    cur = []; render();
  });

  stage.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (mode === 'poly') { cur.pop(); render(); return; }
    if (!data.points.length) return;
    const [px, py] = toImage(e);
    let best = 0, bd = Infinity;
    data.points.forEach(([x, y], i) => { const d = (x - px) ** 2 + (y - py) ** 2; if (d < bd) { bd = d; best = i; } });
    data.points.splice(best, 1);
    render();
  });

  stage.addEventListener('mousemove', (e) => {
    cursor.style.display = 'block';
    const r = stage.getBoundingClientRect();
    cursor.style.left = (e.clientX - r.left) + 'px';
    cursor.style.top = (e.clientY - r.top) + 'px';
  });
  stage.addEventListener('mouseleave', () => { cursor.style.display = 'none'; });

  document.getElementById('undo').onclick = () => {
    if (mode === 'poly' && cur.length) cur.pop();
    else if (mode === 'poly' && data.polys.length) data.polys.pop();
    else data.points.pop();
    render();
  };
  document.getElementById('cancelPoly').onclick = () => { cur = []; render(); };
  document.getElementById('clear').onclick = () => { if (confirm('찍은 점과 영역을 모두 지울까요?')) { data = { points: [], polys: [] }; cur = []; render(); } };
  zoom.addEventListener('input', setZoom);
  window.addEventListener('resize', setZoom);

  document.getElementById('copy').onclick = async () => {
    out.select();
    try { await navigator.clipboard.writeText(out.value); alert('복사했습니다.'); }
    catch (e) { document.execCommand('copy'); alert('복사했습니다.'); }
  };
  document.getElementById('load').onclick = () => {
    try {
      const s = JSON.parse(document.getElementById('paste').value);
      const pts = Array.isArray(s) ? s : s.points;
      const polys = Array.isArray(s) ? [] : (s.polys || []);
      if (!Array.isArray(pts)) throw new Error('형식');
      data = { points: pts, polys };
      cur = []; render();
    } catch (e) { alert('형식이 맞지 않습니다. 복사한 목록을 그대로 붙여넣어 주세요.'); }
  };

  pic.addEventListener('load', () => { setZoom(); render(); });
  if (pic.complete) { setZoom(); }
  render();
})();
</script>
</body>
</html>
